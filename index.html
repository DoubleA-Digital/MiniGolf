<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Golf</title>
<meta name="description" content="Nine generated mini golf holes that build from gentle to brutal. Play a friend on another device with a 4-letter room code — no server, no account.">
<meta name="theme-color" content="#2b8438">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M40 10v34' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M40 10l17 5.5L40 21z' fill='%23ff4d4d'/%3E%3Ccircle cx='22' cy='44' r='9' fill='%23fff'/%3E%3C/svg%3E">
<meta property="og:title" content="Mini Golf">
<meta property="og:description" content="Nine generated holes, easy to hard. Two players, one room code, no server.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://doublea-digital.github.io/MiniGolf/">
<meta name="twitter:card" content="summary">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<style>
  :root{
    --bg:#d7d4ce;
    --ink:#1d2320;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .chip{position:absolute;top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
  .chip.left{left:12px}
  .chip.right{right:12px;flex-direction:row-reverse}
  .av{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px;overflow:hidden}
  .av.p1{background:#ffd8ec}
  .av.p2{background:#f6e0c8}
  .strokes{min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:#5b6167;color:#fff;
      display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;
      box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .strokes.active{background:#fff;color:#1d2320}
  .strokes svg{width:13px;height:13px}
  .nametag{position:absolute;top:62px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .nametag.left{left:14px}
  .nametag.right{right:14px}

  #holeinfo{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(18,26,20,.72);color:#fff;border-radius:16px;padding:8px 16px 9px;text-align:center;
    letter-spacing:.3px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);
    box-shadow:0 6px 22px rgba(0,0,0,.22)}
  .hi-top{display:flex;align-items:center;gap:8px;justify-content:center}
  .hi-top b{font-size:14px;font-weight:900;letter-spacing:.6px}
  .tier{font-size:9.5px;font-weight:900;letter-spacing:.8px;padding:2.5px 7px;border-radius:999px;
    background:#3fa24a;color:#06230b}
  .tier.MEDIUM{background:#f0b429;color:#3a2a00}
  .tier.HARD{background:#ef5b4c;color:#3a0b06}
  .hi-sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;
    font-size:11px;font-weight:700;opacity:.8}
  .hi-sub i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
  .pips{display:flex;gap:4px;justify-content:center;margin-top:7px}
  .pips span{width:13px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.24)}
  .pips span.done{background:rgba(255,255,255,.72)}
  .pips span.now{background:#ffd23d}

  #intro{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
    display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;
    transition:opacity .35s cubic-bezier(.2,.9,.3,1),transform .35s cubic-bezier(.2,.9,.3,1)}
  #intro.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #intro b{font-size:44px;font-weight:900;color:#fff;letter-spacing:-1px;
    text-shadow:0 4px 16px rgba(0,0,0,.45)}
  #intro span{font-size:14px;font-weight:800;color:#fff;opacity:.9;letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.4)}

  .iconbtn{position:absolute;width:44px;height:44px;border-radius:12px;background:rgba(21,24,28,.72);
    color:#fff;border:0;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
    backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .iconbtn:active{transform:scale(.94)}
  #btnZoom{right:14px;bottom:calc(20px + env(safe-area-inset-bottom))}
  #btnCard{right:14px;bottom:calc(74px + env(safe-area-inset-bottom))}
  .iconbtn svg{width:22px;height:22px}

  #power{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));
    width:14px;height:150px;border-radius:8px;background:rgba(21,24,28,.5);overflow:hidden;opacity:0;
    transition:opacity .15s}
  #power.on{opacity:1}
  #powerfill{position:absolute;bottom:0;left:0;right:0;height:0%;
    background:linear-gradient(to top,#5ee06a,#ffd53d 55%,#ff5252)}

  #toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.8);
    background:rgba(18,26,20,.92);color:#fff;padding:16px 30px;border-radius:20px;font-size:26px;
    font-weight:900;opacity:0;transition:opacity .22s,transform .22s cubic-bezier(.2,1.3,.4,1);
    text-align:center;white-space:nowrap;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 14px 40px rgba(0,0,0,.34);letter-spacing:-.4px}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast.good{color:#ffd86b;border-color:rgba(255,216,107,.35)}
  #toast.bad{color:#cfd6cd}
  #toast small{display:block;font-size:13px;font-weight:700;opacity:.72;margin-top:4px;
    color:#fff;letter-spacing:.3px}

  #turnbar{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:rgba(18,26,20,.8);color:#fff;padding:10px 20px;border-radius:22px;
    font-size:13.5px;font-weight:800;backdrop-filter:blur(10px);transition:opacity .2s;
    border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 20px rgba(0,0,0,.2);letter-spacing:.2px}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:20;
    background:radial-gradient(120% 80% at 50% 0%,#46b352 0%,#2b8438 45%,#15491f 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:26px;
    text-align:center;color:#fff;overflow:hidden}
  .screen::before{content:"";position:absolute;inset:-20%;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 46px,transparent 46px 92px);
    pointer-events:none}
  .screen>*{position:relative}
  .screen.hide{display:none}
  .screen h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-1.5px;
    text-shadow:0 6px 24px rgba(0,0,0,.35)}
  .screen p{margin:0;opacity:.85;font-size:14px;max-width:330px;line-height:1.55}
  .logo{width:74px;height:74px;margin-bottom:2px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
  .tagline{display:flex;gap:7px;margin-top:-4px}
  .tagline span{font-size:9.5px;font-weight:900;letter-spacing:1.1px;padding:4px 9px;border-radius:999px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14)}
  .btn{pointer-events:auto;border:0;cursor:pointer;background:#fff;color:#14401d;font-weight:900;
    font-size:16.5px;padding:15px 30px;border-radius:15px;min-width:238px;letter-spacing:.2px;
    box-shadow:0 4px 0 rgba(0,0,0,.22),0 10px 26px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22),0 4px 12px rgba(0,0,0,.16)}
  .btn.alt{background:rgba(255,255,255,.15);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14);
    border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
  .btn:disabled{opacity:.5;cursor:default}
  .field{pointer-events:auto;border:0;border-radius:14px;padding:14px 16px;font-size:20px;width:230px;
    text-align:center;font-weight:800;letter-spacing:4px;text-transform:uppercase;
    background:rgba(255,255,255,.14);color:#fff;outline:none}
  .field::placeholder{color:rgba(255,255,255,.45);letter-spacing:2px}
  .code{font-size:44px;font-weight:900;letter-spacing:10px;padding:10px 0 4px 14px;
    background:rgba(255,255,255,.12);border-radius:16px;width:250px}
  .err{color:#ffc4c4;font-size:13px;min-height:18px;font-weight:600}
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- Scorecard ---------- */
  #card{position:fixed;inset:0;z-index:30;background:rgba(10,14,12,.86);display:flex;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
  #card.hide{display:none}
  .cardbox{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:430px;color:#1d2320;
    box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .cardbox h2{margin:0 0 12px;font-size:20px;text-align:center;font-weight:900}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 2px;text-align:center}
  thead th{font-size:11px;color:#7d8680;font-weight:800;border-bottom:2px solid #eceeeb}
  tbody td{border-bottom:1px solid #f2f4f1}
  tbody tr td:first-child{text-align:left;font-weight:800;padding-left:6px}
  td.tot{font-weight:900;background:#f4f6f3;border-radius:6px}
  .u{color:#d64545;font-weight:800}
  .o{color:#3b7ad6;font-weight:800}
  .cardbox .btn{width:100%;min-width:0;margin-top:14px;background:#2f9a3a;color:#fff}
  .par-row td{color:#7d8680;font-weight:700}
  .th-n{display:block}
  .th-d{display:block;width:12px;height:3px;border-radius:2px;margin:3px auto 0;background:#3fa24a}
  .th-d.MEDIUM{background:#f0b429}
  .th-d.HARD{background:#ef5b4c}
  .cardbox h2{letter-spacing:-.3px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" style="display:none">
  <div class="chip left">
    <div class="av p1" id="av0">🙂</div>
    <div class="strokes" id="st0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 3v13"/><path d="M9 16c-3 0-5 2-5 4"/><path d="M9 6l6 3-6 3"/></svg><span>0</span></div>
  </div>
  <div class="nametag left" id="nm0">You</div>

  <div class="chip right">
    <div class="av p2" id="av1">😀</div>
    <div class="strokes" id="st1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 3v13"/><path d="M9 16c-3 0-5 2-5 4"/><path d="M9 6l6 3-6 3"/></svg><span>0</span></div>
  </div>
  <div class="nametag right" id="nm1">Rival</div>

  <div id="holeinfo">
    <div class="hi-top"><b id="hiHole">HOLE 1</b><span class="tier" id="hiTier">EASY</span></div>
    <div class="hi-sub"><span id="hiPar">PAR 3</span><i></i><span id="hiTot">EVEN</span></div>

  <button class="iconbtn" id="btnCard" title="Scorecard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
  </button>
  <button class="iconbtn" id="btnZoom" title="Toggle view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/></svg>

</div>

<!-- ================= MENU ================= -->
<div class="screen" id="scMenu">
  <svg class="logo" viewBox="0 0 64 64" fill="none">
    <ellipse cx="32" cy="55" rx="20" ry="5" fill="rgba(0,0,0,.18)"/>
    <path d="M40 10v34" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M40 10l17 5.5L40 21z" fill="#ff4d4d"/>
    <circle cx="22" cy="44" r="8" fill="#fff"/>
    <circle cx="19.4" cy="41.4" r="2.4" fill="rgba(0,0,0,.08)"/>
  </svg>
  <h1>MINI GOLF</h1>
  <div class="tagline"><span>9 HOLES</span><span>EASY → HARD</span><span>2 PLAYERS</span></div>
  <p>Nine generated holes that build from gentle to brutal. Lowest total wins.</p>
  <button class="btn" id="bHost">Create Game</button>
  <button class="btn alt" id="bJoinScreen">Join Game</button>
  <button class="btn alt" id="bSolo">Solo Practice</button>
</div>

<!-- ================= HOST LOBBY ================= -->
<div class="screen hide" id="scHost">
  <h1>Room Code</h1>
  <div class="code" id="hostCode">----</div>
  <p id="hostMsg">Share this code. Waiting for your opponent…</p>

</div>

<!-- ================= JOIN ================= -->
<div class="screen hide" id="scJoin">
  <h1>Join Game</h1>
  <input class="field" id="joinCode" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">

</div>

<!-- ================= SCORECARD ================= -->
<div id="card" class="hide">
  <div class="cardbox">
    <h2 id="cardTitle">Scorecard</h2>
    <table>
      <thead><tr id="cardHead"></tr></thead>
      <tbody id="cardBody"></tbody>
    </table>
    <button class="btn" id="bCardClose">Close</button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   CONSTANTS
   ============================================================ */
// Wider and less tall than before: the old 15x32 grid produced thin twisty
// corridors, where the reference game is built from broad open rooms.
const COLS = 18, ROWS = 26, CELL = 40;
const WORLD_W = COLS * CELL, WORLD_H = ROWS * CELL;

// T_ROUGH is the darker-green slow band; sand is kept but rare. Value 3 was
// water, removed once ponds stopped being generated — the remaining values keep
// their original numbers so previously generated courses still decode.
const T_WALL = 0, T_GREEN = 1, T_SAND = 2, T_BOOST = 4,
      T_PORTAL = 5, T_ROUGH = 6;

const BALL_R      = 7.5;
const HOLE_R      = 13;
// Feel: the ball used to glide and carom like an air-hockey puck. Lower launch
// speed, heavier friction and a linear rolling resistance make it settle
// decisively instead of drifting, and softer restitution stops walls from
// firing it back across the hole.
const MAX_SPEED   = 1150;    // px/s at full power
const MAX_DRAG    = 130;     // screen px for full power
const FRIC_GREEN  = 0.9865;  // per 1/60s
const FRIC_ROUGH  = 0.972;
const FRIC_SAND   = 0.945;
const ROLL_DECEL  = 60;      // px/s^2 of constant drag, so it comes to a stop
const REST        = 0.58;    // wall bounciness
const BUMPER_REST = 0.70;    // rubber bumpers still kick, but don't rocket
const BUMPER_R    = 15;
const STOP_SPEED  = 14;
const HOLE_CATCH  = 620;     // max speed to drop in (dead-centre; scaled toward the rim)
const HOLE_CENTER = 0.5;     // how much harder it is to sink off-centre
const HOLE_MAGNET = 500;     // px/s^2 pull near the cup
const BOOST_ACC   = 1100;
const SHOT_TIMEOUT= 14;      // seconds before force-stop
const STROKE_LIMIT= 10;
const HOLES       = 9;
const DT          = 1 / 120;

// Difficulty curve across the 9 holes: eases in, spikes, backs off, then builds
// to the hardest finish — a real course's rhythm rather than a straight ramp.
const DIFF_CURVE  = [0.00, 0.12, 0.30, 0.22, 0.48, 0.68, 0.55, 0.85, 1.00];
const tierOf = d => d < 0.34 ? 'EASY' : d < 0.68 ? 'MEDIUM' : 'HARD';

const SCORE_NAMES = {'-4':'Condor','-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par',
                     '1':'Bogey','2':'Double Bogey','3':'Triple Bogey'};

/* ============================================================
   SEEDED RNG  (identical courses on both devices)
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   COURSE GENERATION
   A course is a grid. We carve a corridor from tee to hole with
   random turns, then stamp hazards and inner obstacles, checking
   after every change that tee -> hole is still reachable.
   ============================================================ */
function genCourse(seed, diff){
  diff = Math.max(0, Math.min(1, diff ?? 0.5));
  const rnd = mulberry32(seed >>> 0);
  const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  // Everything below scales off `diff`: easy holes are wide, short and nearly
  // empty; hard holes are narrower, longer and busier.
  const lerp = (a, b) => a + (b - a) * diff;

  const tiles = new Uint8Array(COLS * ROWS);          // T_* per cell
  const boost = new Int8Array(COLS * ROWS * 2);       // boost dir per cell (dx,dy)
  const portal = new Int32Array(COLS * ROWS).fill(-1);// linked cell index

  const idx = (c, r) => r * COLS + c;
  const inb = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;

  const W = diff < 0.34 ? 5 : diff < 0.68 ? ri(4, 5) : 4;          // corridor width
  const carve = (c0, r0, c1, r1) => {
    for (let r = Math.max(0, r0); r <= Math.min(ROWS - 1, r1); r++)
      for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++)
        tiles[idx(c, r)] = T_GREEN;
  };

  // --- carve the corridor: up, turn, up, turn ... ---
  let c = ri(1, COLS - W - 1);
  let r = ROWS - W - 1;
  const teeC = c, teeR = r;
  const segs = Math.round(lerp(2.6, 4.0)) + ri(0, 1);

  for (let s = 0; s < segs; s++){
    // vertical run upward
    const vlen = ri(3, 6);
    const nr = Math.max(1, r - vlen);
    carve(c, nr, c + W - 1, r + W - 1);
    r = nr;

    // Open the fairway into a room every so often. These bulges are what make
    // the hole read as a playfield with space to line up, rather than a pipe.
    if (rnd() < lerp(0.7, 0.35)){
      const rw = ri(W + 1, W + 3), rh = ri(W, W + 2);
      const rc = Math.max(1, Math.min(COLS - rw - 1, c - ri(0, 2)));
      const rr = Math.max(1, Math.min(ROWS - rh - 1, r));
      carve(rc, rr, rc + rw - 1, rr + rh - 1);
    }
    if (r <= 1) break;

    // horizontal turn
    const hlen = ri(3, 6);
    const left = rnd() < 0.5;
    let nc = left ? c - hlen : c + hlen;
    nc = Math.max(1, Math.min(COLS - W - 1, nc));
    carve(Math.min(c, nc), r, Math.max(c, nc) + W - 1, r + W - 1);
    c = nc;
  }
  const holeC = c, holeR = r;

  const teeCell  = idx(teeC  + (W >> 1), teeR  + (W >> 1));
  const holeCell = idx(holeC + (W >> 1), holeR + (W >> 1));

  // --- reachability (BFS over playable cells) ---
  const reach = () => {
    const seen = new Uint8Array(COLS * ROWS);
    const q = [teeCell]; seen[teeCell] = 1;
    let dist = new Int32Array(COLS * ROWS).fill(-1); dist[teeCell] = 0;
    for (let h = 0; h < q.length; h++){
      const cur = q[h], cc = cur % COLS, cr = (cur / COLS) | 0;
      const nb = [[cc+1,cr],[cc-1,cr],[cc,cr+1],[cc,cr-1]];
      for (const [x, y] of nb){
        if (!inb(x, y)) continue;
        const n = idx(x, y);
        if (seen[n] || tiles[n] === T_WALL) continue;
        seen[n] = 1; dist[n] = dist[cur] + 1; q.push(n);
      }
    }
    return { ok: seen[holeCell] === 1, dist, seen };
  };
  if (!reach().ok) return genCourse(seed + 1, diff);   // pathological layout, reroll

  const playable = [];
  for (let i = 0; i < tiles.length; i++) if (tiles[i] !== T_WALL) playable.push(i);

  const far = (i, cell, n) => {
    const a = { c: i % COLS, r: (i / COLS) | 0 }, b = { c: cell % COLS, r: (cell / COLS) | 0 };
    return Math.abs(a.c - b.c) + Math.abs(a.r - b.r) > n;
  };
  const freeSpot = (w, h) => {                 // find a rect of green cells not near tee/hole
    for (let tries = 0; tries < 60; tries++){
      const p = playable[ri(0, playable.length - 1)];
      const pc = p % COLS, pr = (p / COLS) | 0;
      if (!far(p, teeCell, 3) || !far(p, holeCell, 3)) continue;
      let ok = true;
      for (let y = pr; y < pr + h && ok; y++)
        for (let x = pc; x < pc + w && ok; x++)
          if (!inb(x, y) || tiles[idx(x, y)] !== T_GREEN) ok = false;
      if (ok) return { c: pc, r: pr };
    }
    return null;
  };
  const stamp = (spot, w, h, type) => {
    for (let y = spot.r; y < spot.r + h; y++)
      for (let x = spot.c; x < spot.c + w; x++) tiles[idx(x, y)] = type;
  };

  // --- inner obstacles -------------------------------------------------
  // Every shape is applied speculatively and rolled back if it would seal
  // the hole off, so the course always stays completable.
  // Cells no obstacle may ever cover: the tee, the cup, and a ring around each.
  // reach() seeds its BFS at the tee, so a shape sitting on the tee would still
  // report "reachable" — this guard is what actually keeps the tee clear.
  const guarded = new Set();
  for (const base of [teeCell, holeCell]){
    const gc = base % COLS, gr = (base / COLS) | 0;
    for (let y = gr - 1; y <= gr + 1; y++)
      for (let x = gc - 1; x <= gc + 1; x++)
        if (inb(x, y)) guarded.add(idx(x, y));
  }

  const tryShape = cells => {
    if (!cells || !cells.length) return false;
    const saved = [];
    for (const k of cells){
      if (k < 0 || k >= tiles.length) return false;
      if (guarded.has(k)) return false;
      saved.push([k, tiles[k]]);
    }
    for (const k of cells) tiles[k] = T_WALL;
    if (reach().ok) return true;
    for (const [k, v] of saved) tiles[k] = v;
    return false;
  };

  // Free-standing blocks sitting out in the open, the way the reference game
  // does it. Requesting a spot two cells larger than the block guarantees a
  // ring of fairway around it, so it reads as an island to play off rather
  // than a wall growing out of the edge — and it can never pinch a corridor.
  const makeBlock = (w, h) => {
    for (let tries = 0; tries < 40; tries++){
      const spot = freeSpot(w + 2, h + 2);
      if (!spot) continue;
      const cells = [];
      for (let y = spot.r + 1; y < spot.r + 1 + h; y++)
        for (let x = spot.c + 1; x < spot.c + 1 + w; x++) cells.push(idx(x, y));
      if (tryShape(cells)) return true;
    }
    return false;
  };

  // Blocks were measured as the biggest source of wasted strokes, so their
  // count is what most of the difficulty ramp rides on.
  for (let i = 0, n = Math.round(lerp(1.0, 2.8)); i < n; i++){
    const big = rnd() < lerp(0.08, 0.34);
    makeBlock(big ? 2 : 1, big ? 2 : 1);
  }

  // --- rough: darker-green slow bands, the main texture hazard ---
  for (let i = 0, n = Math.round(lerp(0.6, 2.4)); i < n; i++){
    const w = ri(3, 4), h = ri(1, 2), spot = freeSpot(w, h);
    if (spot) stamp(spot, w, h, T_ROUGH);
  }
  // --- sand: kept for variety but small and occasional, not a dominant blob ---
  if (rnd() < lerp(0.12, 0.55)){
    const w = ri(2, 3), h = 2, spot = freeSpot(w, h);
    if (spot) stamp(spot, w, h, T_SAND);
  }
  // --- boost pads (push along a cardinal direction) ---
  for (let i = 0, n = ri(0, diff > 0.5 ? 2 : 1); i < n; i++){
    const w = ri(2, 3), h = ri(1, 2), spot = freeSpot(w, h);
    if (!spot) continue;
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    const d = dirs[ri(0, 3)];
    stamp(spot, w, h, T_BOOST);
    for (let y = spot.r; y < spot.r + h; y++)
      for (let x = spot.c; x < spot.c + w; x++){
        boost[idx(x,y) * 2]     = d[0];
        boost[idx(x,y) * 2 + 1] = d[1];
      }
  }
  // --- portal pair ---
  if (rnd() < lerp(0.12, 0.5)){
    const a = freeSpot(1, 1);
    const b = a ? freeSpot(1, 1) : null;
    // Keep both ends well clear of the cup — a portal beside the hole can
    // snatch a finishing putt and fling it back down the course.
    if (a && b && (Math.abs(a.r - b.r) + Math.abs(a.c - b.c)) > 8 &&
        far(idx(a.c, a.r), holeCell, 6) && far(idx(b.c, b.r), holeCell, 6)){
      const ia = idx(a.c, a.r), ib = idx(b.c, b.r);
      tiles[ia] = T_PORTAL; tiles[ib] = T_PORTAL;
      portal[ia] = ib; portal[ib] = ia;
    }
  }

  // --- rubber bumpers (circles, not grid cells) ---
  // Only placed where the surrounding 3x3 is open fairway, so a bumper can
  // never plug a corridor — it just deflects.
  const bumpers = [];
  for (let i = 0, n = Math.round(lerp(0, 1.1)); i < n; i++){
    for (let tries = 0; tries < 40; tries++){
      const p = playable[ri(0, playable.length - 1)];
      const pc = p % COLS, pr = (p / COLS) | 0;
      if (!far(p, teeCell, 4) || !far(p, holeCell, 4)) continue;
      // The 3x3 must be plain fairway. Portals especially: a teleport drops the
      // ball at a cell centre, and if a bumper sat there it would land embedded.
      let open = true;
      for (let y = pr - 1; y <= pr + 1 && open; y++)
        for (let x = pc - 1; x <= pc + 1 && open; x++){
          const tt = inb(x, y) ? tiles[idx(x, y)] : T_WALL;
          if (tt === T_WALL || tt === T_PORTAL) open = false;
        }
      if (!open) continue;
      const bx = (pc + 0.5) * CELL, by = (pr + 0.5) * CELL;
      if (bumpers.some(m => Math.hypot(m.x - bx, m.y - by) < CELL * 2.2)) continue;
      bumpers.push({ x: bx, y: by, r: BUMPER_R, hit: -1e9 });
      break;
    }
  }

  // Wall cells with no connection to the outside are free-standing blocks, and
  // get drawn as solid white islands rather than as holes cut in the fairway.
  const island = new Uint8Array(COLS * ROWS);
  {
    const outside = new Uint8Array(COLS * ROWS);
    const q = [];
    const seedOut = k => { if (tiles[k] === T_WALL && !outside[k]){ outside[k] = 1; q.push(k); } };
    for (let x = 0; x < COLS; x++){ seedOut(idx(x, 0)); seedOut(idx(x, ROWS - 1)); }
    for (let y = 0; y < ROWS; y++){ seedOut(idx(0, y)); seedOut(idx(COLS - 1, y)); }
    for (let h = 0; h < q.length; h++){
      const cur = q[h], cc = cur % COLS, cr = (cur / COLS) | 0;
      for (const [x, y] of [[cc+1,cr],[cc-1,cr],[cc,cr+1],[cc,cr-1]]){
        if (!inb(x, y)) continue;
        const n = idx(x, y);
        if (outside[n] || tiles[n] !== T_WALL) continue;
        outside[n] = 1; q.push(n);
      }
    }
    for (let k = 0; k < tiles.length; k++)
      if (tiles[k] === T_WALL && !outside[k]) island[k] = 1;
  }

  // hazards can't strand the ball — if something broke, reroll the whole hole
  if (!reach().ok) return genCourse(seed + 977, diff);

  // --- par from walking distance, nudged up on the busier holes ---
  const d = reach().dist[holeCell];
  const clutter = bumpers.length + island.reduce((a, b) => a + b, 0) * 0.5;
  const par = Math.max(2, Math.min(5,
    1 + Math.round((d - 6) / 9 + Math.min(1.0, clutter * 0.12) + diff * 1.15)));

  return {
    tiles, boost, portal, par, bumpers, island, diff, tier: tierOf(diff),
    tee:  { x: (teeC  + W / 2) * CELL, y: (teeR  + W / 2) * CELL },
    hole: { x: (holeC + W / 2) * CELL, y: (holeR + W / 2) * CELL }
  };
}

/* ============================================================
   GAME STATE
   ============================================================ */
const G = {
  mode: 'menu',          // menu | play
  online: false,
  seed: 0,
  hole: 0,
  course: null,
  me: 0,                 // my player index
  turn: 0,               // whose shot it is
  players: [],
  aiming: false,
  aim: { x: 0, y: 0 },
  simTime: 0,
  busy: false,           // a shot is in flight
  overview: false,
  viewLock: 0            // seconds of forced overview at hole start
};

function newPlayer(name){
  return { name, scores: new Array(HOLES).fill(null), strokes: 0,
           holed: false, ball: { x: 0, y: 0, vx: 0, vy: 0, moving: false, portalCd: 0 },
           lastRest: { x: 0, y: 0 } };
}

/* ============================================================
   CANVAS + CAMERA
   ============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const cam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1, tx: 0, ty: 0, tz: 1 };

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const fitZoom  = () => Math.min(VW / WORLD_W, VH / WORLD_H) * 0.94;
// Pulled back from 9.5x13 cells so more of the hole is in frame while aiming.
const playZoom = () => Math.min(VW / (12.5 * CELL), VH / (17 * CELL));

function updateCamera(dt){
  const overview = G.overview || G.viewLock > 0;
  if (overview){
    cam.tz = fitZoom();
    cam.tx = WORLD_W / 2; cam.ty = WORLD_H / 2;
  } else {
    // Ease out as the shot is pulled back, so a big swing shows more of the
    // hole you're aiming into. Scales with power, not just with aiming.
    const pull = G.aiming ? Math.min(1, Math.hypot(G.aim.x, G.aim.y) / MAX_DRAG) : 0;
    cam.tz = playZoom() * (1 - 0.24 * pull);
    const b = focusBall();
    cam.tx = b.x; cam.ty = b.y;
    // keep the camera inside the world when the view is smaller than the course
    const halfW = VW / (2 * cam.tz), halfH = VH / (2 * cam.tz);
    cam.tx = (halfW * 2 >= WORLD_W) ? WORLD_W / 2 : Math.max(halfW, Math.min(WORLD_W - halfW, cam.tx));
    cam.ty = (halfH * 2 >= WORLD_H) ? WORLD_H / 2 : Math.max(halfH, Math.min(WORLD_H - halfH, cam.ty));
  }
  const k = 1 - Math.pow(0.0035, dt);
  cam.x += (cam.tx - cam.x) * k;
  cam.y += (cam.ty - cam.y) * k;
  cam.zoom += (cam.tz - cam.zoom) * k;
}
function focusBall(){
  const moving = G.players.find(p => p.ball.moving);
  if (moving) return moving.ball;
  const p = G.players[G.turn];
  return p ? p.ball : { x: WORLD_W / 2, y: WORLD_H / 2 };
}

/* ============================================================
   PHYSICS
   ============================================================ */
const tileAtCell = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? T_WALL : G.course.tiles[r * COLS + c];
const tileAt = (x, y) => tileAtCell(Math.floor(x / CELL), Math.floor(y / CELL));
const isWall = (c, r) => tileAtCell(c, r) === T_WALL;

function resolveWalls(b){
  const c0 = Math.floor((b.x - BALL_R) / CELL), c1 = Math.floor((b.x + BALL_R) / CELL);
  const r0 = Math.floor((b.y - BALL_R) / CELL), r1 = Math.floor((b.y + BALL_R) / CELL);
  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      if (!isWall(c, r)) continue;
      const bx = c * CELL, by = r * CELL;
      const nx = Math.max(bx, Math.min(b.x, bx + CELL));
      const ny = Math.max(by, Math.min(b.y, by + CELL));
      let dx = b.x - nx, dy = b.y - ny;
      let d2 = dx * dx + dy * dy;

      if (d2 > BALL_R * BALL_R) continue;

      if (d2 < 1e-6){
        // centre is inside the block: eject along the shallowest face
        const cand = [[bx - BALL_R - b.x, 0, -1, 0], [bx + CELL + BALL_R - b.x, 0, 1, 0],
                      [0, by - BALL_R - b.y, 0, -1], [0, by + CELL + BALL_R - b.y, 0, 1]];
        let best = cand[0], bd = Infinity;
        for (const k of cand){ const m = Math.abs(k[0] + k[1]); if (m < bd){ bd = m; best = k; } }
        b.x += best[0]; b.y += best[1];
        if (best[2]) b.vx = -b.vx * REST; else b.vy = -b.vy * REST;
        continue;
      }
      const d = Math.sqrt(d2), inx = dx / d, iny = dy / d;
      b.x = nx + inx * BALL_R;
      b.y = ny + iny * BALL_R;
      const dot = b.vx * inx + b.vy * iny;
      if (dot < 0){
        b.vx -= (1 + REST) * dot * inx;
        b.vy -= (1 + REST) * dot * iny;
      }
    }
  }
}

// Rubber bumpers: circular, and bouncier than walls so they kick the ball hard.
function resolveBumpers(b){
  const list = G.course.bumpers;
  for (let i = 0; i < list.length; i++){
    const m = list[i];
    const dx = b.x - m.x, dy = b.y - m.y;
    const rr = m.r + BALL_R;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr) continue;
    let d, nx, ny;
    if (d2 < 1e-9){
      // dead centre (a wall can shove the ball onto the pin): eject backwards
      const sp = Math.hypot(b.vx, b.vy) || 1;
      d = 0; nx = -b.vx / sp; ny = -b.vy / sp;
    } else {
      d = Math.sqrt(d2); nx = dx / d; ny = dy / d;
    }
    b.x = m.x + nx * rr;
    b.y = m.y + ny * rr;
    const dot = b.vx * nx + b.vy * ny;
    if (dot < 0){
      b.vx -= (1 + BUMPER_REST) * dot * nx;
      b.vy -= (1 + BUMPER_REST) * dot * ny;
      m.hit = perfNow;               // for the flash effect when drawing
    }
  }
}

function stepBall(p, dt){
  const b = p.ball;
  if (!b.moving) return;

  const t = tileAt(b.x, b.y);

  // surface friction
  let fric = FRIC_GREEN;
  if (t === T_ROUGH) fric = FRIC_ROUGH;
  if (t === T_SAND)  fric = FRIC_SAND;
  b.vx *= Math.pow(fric, dt * 60);
  b.vy *= Math.pow(fric, dt * 60);

  // Constant rolling resistance on top of the exponential decay. Without it the
  // ball keeps creeping for a long tail; with it the roll-out is predictable.
  const sp0 = Math.hypot(b.vx, b.vy);
  if (sp0 > 0){
    const drop = Math.min(sp0, ROLL_DECEL * dt);
    b.vx -= b.vx / sp0 * drop;
    b.vy -= b.vy / sp0 * drop;
  }

  // boost pads
  if (t === T_BOOST){
    const i = (Math.floor(b.y / CELL) * COLS + Math.floor(b.x / CELL)) * 2;
    b.vx += G.course.boost[i]     * BOOST_ACC * dt;
    b.vy += G.course.boost[i + 1] * BOOST_ACC * dt;
  }

  // gentle pull toward the cup so near-misses drop
  const hd0 = Math.hypot(G.course.hole.x - b.x, G.course.hole.y - b.y);
  if (hd0 < HOLE_R * 2.2 && hd0 > 0.01){
    const a = HOLE_MAGNET * (1 - hd0 / (HOLE_R * 2.2));
    b.vx += (G.course.hole.x - b.x) / hd0 * a * dt;
    b.vy += (G.course.hole.y - b.y) / hd0 * a * dt;
  }

  // integrate in small substeps so fast shots can't tunnel through walls
  const dist = Math.hypot(b.vx, b.vy) * dt;
  const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
  for (let s = 0; s < steps; s++){
    b.x += b.vx * dt / steps;
    b.y += b.vy * dt / steps;
    // Two passes: resolving a wall can shove the ball into a bumper and vice
    // versa, so a single pass can leave it embedded in the other one.
    resolveWalls(b);
    resolveBumpers(b);
    resolveWalls(b);
    resolveBumpers(b);

    // Cup test runs every substep against the ball's LIVE position — testing
    // once per frame let fast putts step straight over the hole. The speed it
    // will accept scales with how centred the ball is, so a putt through the
    // middle drops while one clipping the rim has to be crawling.
    const dx = G.course.hole.x - b.x, dy = G.course.hole.y - b.y;
    const hd = Math.hypot(dx, dy);
    if (hd < HOLE_R){
      const limit = HOLE_CATCH * (1 - (hd / HOLE_R) * HOLE_CENTER);
      if (Math.hypot(b.vx, b.vy) < limit){
        b.moving = false; b.vx = b.vy = 0;
        b.x = G.course.hole.x; b.y = G.course.hole.y;
        p.sunk = true;
        return;
      }
    }
  }

  if (b.portalCd > 0) b.portalCd -= dt;

  // portals
  if (t === T_PORTAL && b.portalCd <= 0){
    const here = Math.floor(b.y / CELL) * COLS + Math.floor(b.x / CELL);
    const dest = G.course.portal[here];
    if (dest >= 0){
      b.x = (dest % COLS + 0.5) * CELL;
      b.y = ((dest / COLS | 0) + 0.5) * CELL;
      b.portalCd = 0.45;
      sfxPing();
    }
  }

  if (Math.hypot(b.vx, b.vy) < STOP_SPEED){
    b.moving = false; b.vx = b.vy = 0;
  }
}

/* ============================================================
   RENDERING
   ============================================================ */
const SS = 2;                              // supersample factor for the static layer
let statCv = null, statCtx = null;

// The fairway, walls, blocks and ground hazards never move, so they are painted
// once per hole into an offscreen canvas. That keeps the per-frame work to the
// handful of things that actually animate, and lets the static art afford
// shadows and texture it could not afford every frame.
function buildStatic(){
  if (!statCv){
    statCv = document.createElement('canvas');
    statCv.width = WORLD_W * SS; statCv.height = WORLD_H * SS;
    statCtx = statCv.getContext('2d');
  }
  const g = statCtx;
  const tiles = G.course.tiles, island = G.course.island;
  g.setTransform(SS, 0, 0, SS, 0, 0);
  g.clearRect(0, 0, WORLD_W, WORLD_H);

  const fairwayPath = () => {
    g.beginPath();
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (tiles[r * COLS + c] !== T_WALL) g.rect(c * CELL, r * CELL, CELL, CELL);
  };

  // drop shadow beneath the whole green, for a sense of a raised table
  g.save();
  g.shadowColor = 'rgba(28,44,30,.34)'; g.shadowBlur = 26; g.shadowOffsetY = 14;
  g.fillStyle = '#3f8f45'; fairwayPath(); g.fill();
  g.restore();

  // surfaces, with a mown-stripe pattern across the grass
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const t = tiles[r * COLS + c];
      if (t === T_WALL) continue;
      const x = c * CELL, y = r * CELL;
      const stripe = ((r >> 1) & 1) === 0;
      g.fillStyle = t === T_SAND  ? '#e2d3a2'
                  : t === T_ROUGH ? (stripe ? '#39963f' : '#358f3b')
                  : t === T_BOOST ? (stripe ? '#63c96a' : '#5cc263')
                  : (stripe ? '#4fb257' : '#49ab51');
      g.fillRect(x, y, CELL + 0.5, CELL + 0.5);

      if (t === T_SAND){                       // speckle
        g.fillStyle = 'rgba(180,160,105,.5)';
        for (let k = 0; k < 7; k++){
          const hx = ((c * 37 + r * 91 + k * 53) % 31) + 4;
          const hy = ((c * 61 + r * 17 + k * 29) % 31) + 4;
          g.beginPath(); g.arc(x + hx, y + hy, 1.3, 0, Math.PI * 2); g.fill();
        }
      }
      if (t === T_ROUGH){                      // short grass tufts
        g.strokeStyle = 'rgba(20,80,28,.25)'; g.lineWidth = 1.6; g.lineCap = 'round';
        for (let k = 0; k < 5; k++){
          const hx = ((c * 43 + r * 71 + k * 59) % 30) + 5;
          const hy = ((c * 23 + r * 53 + k * 37) % 28) + 6;
          g.beginPath(); g.moveTo(x + hx, y + hy); g.lineTo(x + hx + 2, y + hy - 5); g.stroke();
        }
      }
    }
  }

  // inner shading so the green looks recessed inside its walls
  g.save();
  fairwayPath(); g.clip();
  g.strokeStyle = 'rgba(20,70,26,.16)'; g.lineWidth = 10;
  g.beginPath();
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (tiles[r * COLS + c] === T_WALL) continue;
      const x = c * CELL, y = r * CELL;
      if (isWall(c, r - 1)){ g.moveTo(x, y); g.lineTo(x + CELL, y); }
      if (isWall(c, r + 1)){ g.moveTo(x, y + CELL); g.lineTo(x + CELL, y + CELL); }
      if (isWall(c - 1, r)){ g.moveTo(x, y); g.lineTo(x, y + CELL); }
      if (isWall(c + 1, r)){ g.moveTo(x + CELL, y); g.lineTo(x + CELL, y + CELL); }
    }
  }
  g.stroke();
  g.restore();

  // walls: a soft underside first, then the white rail on top
  const railPath = () => {
    g.beginPath();
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        if (tiles[r * COLS + c] === T_WALL) continue;
        const x = c * CELL, y = r * CELL;
        if (isWall(c, r - 1)){ g.moveTo(x, y); g.lineTo(x + CELL, y); }
        if (isWall(c, r + 1)){ g.moveTo(x, y + CELL); g.lineTo(x + CELL, y + CELL); }
        if (isWall(c - 1, r)){ g.moveTo(x, y); g.lineTo(x, y + CELL); }
        if (isWall(c + 1, r)){ g.moveTo(x + CELL, y); g.lineTo(x + CELL, y + CELL); }
      }
    }
  };
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = '#c8d2c6'; g.lineWidth = 8;
  g.save(); g.translate(0, 2.5); railPath(); g.stroke(); g.restore();
  g.strokeStyle = '#ffffff'; g.lineWidth = 7.5; railPath(); g.stroke();

  // free-standing blocks: shadow, white top, tinted lip
  const blockPath = (dx, dy, inset) => {
    g.beginPath();
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++){
        if (!island[r * COLS + c]) continue;
        const up = r > 0 && island[(r - 1) * COLS + c];
        const lf = c > 0 && island[r * COLS + c - 1];
        const w = CELL + (lf ? 0.5 : 0), h = CELL + (up ? 0.5 : 0);
        g.roundRect(c * CELL + dx + inset, r * CELL + dy + inset,
                    w - inset * 2, h - inset * 2, 5);
      }
  };
  if (typeof g.roundRect === 'function'){
    g.save(); g.shadowColor = 'rgba(25,45,28,.4)'; g.shadowBlur = 10; g.shadowOffsetY = 5;
    g.fillStyle = '#e8ece6'; blockPath(0, 0, 1); g.fill(); g.restore();
    g.fillStyle = '#ffffff'; blockPath(0, -2, 1); g.fill();
  } else {                                   // older engines without roundRect
    g.fillStyle = '#ffffff';
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (island[r * COLS + c]) g.fillRect(c * CELL, r * CELL, CELL, CELL);
  }

  // tee mat
  const tee = G.course.tee;
  g.fillStyle = 'rgba(255,255,255,.22)';
  if (typeof g.roundRect === 'function'){
    g.beginPath(); g.roundRect(tee.x - 15, tee.y - 10, 30, 20, 6); g.fill();
  }
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
  g.beginPath(); g.arc(tee.x, tee.y, 10, 0, Math.PI * 2); g.stroke();
}

// confetti for a birdie or better
const confetti = [];
function burstConfetti(n){
  for (let i = 0; i < n; i++)
    confetti.push({ x: VW / 2, y: VH * 0.42,
      vx: (Math.random() - 0.5) * 520, vy: -180 - Math.random() * 380,
      r: 3 + Math.random() * 4, a: 1, rot: Math.random() * 6.28,
      col: ['#ffd23d','#ff6b6b','#4ecb71','#4aa3ff','#ffffff'][(Math.random() * 5) | 0] });
}

function draw(){
  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#dde2d8'); bg.addColorStop(1, '#c6cdc2');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  if (!G.course || !statCv) return;

  ctx.save();
  ctx.translate(VW / 2, VH / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // static layer
  ctx.drawImage(statCv, 0, 0, WORLD_W, WORLD_H);

  const tiles = G.course.tiles;

  // --- animated boost chevrons ---
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (tiles[r * COLS + c] !== T_BOOST) continue;
      const i = (r * COLS + c) * 2;
      const dx = G.course.boost[i], dy = G.course.boost[i + 1];
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
      for (let k = 0; k < 2; k++){
        const t = ((perfNow / 700 + k * 0.5) % 1);
        const oy = 14 - t * 28;
        ctx.globalAlpha = Math.sin(t * Math.PI) * 0.55;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(-6, oy + 4); ctx.lineTo(0, oy - 3); ctx.lineTo(6, oy + 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  // --- portals ---
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (tiles[r * COLS + c] !== T_PORTAL) continue;
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
      const pulse = 1 + Math.sin(perfNow / 420) * 0.06;
      ctx.save();
      ctx.shadowColor = 'rgba(245,207,61,.85)'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#f5cf3d';
      ctx.beginPath(); ctx.arc(x, y, 16 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(perfNow / 1400);
      ctx.strokeStyle = '#fff8dd'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      for (let k = 0; k < 4; k++){
        ctx.rotate(Math.PI / 2);
        ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, -10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-3, -7); ctx.lineTo(0, -11); ctx.lineTo(3, -7); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // --- bumpers ---
  for (const m of G.course.bumpers){
    const since = (perfNow - m.hit) / 1000;
    const pop = since < 0.25 ? (1 - since / 0.25) : 0;
    const rr = m.r + pop * 3;
    ctx.fillStyle = 'rgba(25,45,28,.32)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y + 4, rr, rr * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    const gr = ctx.createRadialGradient(m.x - rr * 0.35, m.y - rr * 0.4, rr * 0.15, m.x, m.y, rr);
    if (pop > 0){ gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#ff9a92'); }
    else { gr.addColorStop(0, '#ff8079'); gr.addColorStop(1, '#d8443c'); }
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(m.x, m.y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(m.x, m.y, rr, 0, Math.PI * 2); ctx.stroke();
  }

  // --- cup + flag ---
  const h = G.course.hole;
  ctx.fillStyle = 'rgba(22,48,24,.22)';
  ctx.beginPath(); ctx.arc(h.x, h.y, HOLE_R + 4, 0, Math.PI * 2); ctx.fill();
  const cupg = ctx.createRadialGradient(h.x, h.y - 3, 1, h.x, h.y, HOLE_R);
  cupg.addColorStop(0, '#0d1c08'); cupg.addColorStop(1, '#22401a');
  ctx.fillStyle = cupg;
  ctx.beginPath(); ctx.arc(h.x, h.y, HOLE_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(h.x, h.y, HOLE_R - 0.8, Math.PI * 0.9, Math.PI * 2.1); ctx.stroke();
  // pole + waving flag
  ctx.strokeStyle = 'rgba(25,45,28,.25)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(h.x + 2, h.y - 1); ctx.lineTo(h.x + 9, h.y - 26); ctx.stroke();
  ctx.strokeStyle = '#f4f6f2'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(h.x, h.y - 2); ctx.lineTo(h.x, h.y - 40); ctx.stroke();
  const wav = Math.sin(perfNow / 300) * 2.5;
  ctx.fillStyle = '#ff4d4d';
  ctx.beginPath();
  ctx.moveTo(h.x, h.y - 40);
  ctx.quadraticCurveTo(h.x + 12, h.y - 39 + wav, h.x + 21, h.y - 33 + wav);
  ctx.quadraticCurveTo(h.x + 12, h.y - 30 - wav, h.x, h.y - 26);
  ctx.closePath(); ctx.fill();

  // --- aim guide ---
  if (G.aiming && canShoot()){
    const b = G.players[G.me].ball;
    const len = Math.hypot(G.aim.x, G.aim.y);
    if (len > 3){
      const pow = Math.min(1, len / MAX_DRAG);
      const ux = G.aim.x / len, uy = G.aim.y / len;
      const reach = 34 + pow * 170;
      const col = pow < 0.5 ? '#eafbe9' : pow < 0.8 ? '#ffd23d' : '#ff6b5c';
      // graded dots along the line
      const dots = 9;
      for (let i = 1; i <= dots; i++){
        const f = i / dots;
        ctx.globalAlpha = (1 - f * 0.55) * (0.45 + pow * 0.55);
        ctx.fillStyle = col;
        const rr = 3.4 * (1 - f * 0.45);
        ctx.beginPath(); ctx.arc(b.x + ux * reach * f, b.y + uy * reach * f, rr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // power arc around the ball
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
      const a0 = Math.atan2(uy, ux);
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R + 7, a0 - pow * Math.PI, a0 + pow * Math.PI);
      ctx.stroke();
      // pull-back stub
      ctx.strokeStyle = 'rgba(20,40,22,.3)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - ux * pow * 30, b.y - uy * pow * 30); ctx.stroke();
    }
  }

  // --- balls ---
  G.players.forEach((p, i) => {
    const b = p.ball;
    const base = i === 0 ? '#ffffff' : '#ff6a5d';
    // motion trail
    if (b.trail && b.trail.length > 1){
      for (let k = 0; k < b.trail.length; k++){
        const f = k / b.trail.length;
        ctx.globalAlpha = f * 0.3;
        ctx.fillStyle = base;
        ctx.beginPath(); ctx.arc(b.trail[k].x, b.trail[k].y, BALL_R * (0.35 + f * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(25,45,28,.3)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y + 4, BALL_R * 1.05, BALL_R * 0.72, 0, 0, Math.PI * 2); ctx.fill();
    const bg2 = ctx.createRadialGradient(b.x - 2.6, b.y - 3, 0.8, b.x, b.y, BALL_R);
    bg2.addColorStop(0, i === 0 ? '#ffffff' : '#ffb1a7');
    bg2.addColorStop(1, i === 0 ? '#d8ded6' : '#e04b3f');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(b.x - 2.4, b.y - 2.6, BALL_R * 0.28, 0, Math.PI * 2); ctx.fill();
    if (i === G.turn && !G.busy && !p.holed){
      ctx.strokeStyle = i === 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,106,93,.9)';
      ctx.lineWidth = 2;
      const rr = BALL_R + 6 + Math.sin(perfNow / 260) * 2.2;
      ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, Math.PI * 2); ctx.stroke();
    }
  });

  ctx.restore();

  // --- confetti (screen space) ---
  for (let i = confetti.length - 1; i >= 0; i--){
    const p = confetti[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.a);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
    ctx.restore();
    if (p.a <= 0) confetti.splice(i, 1);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let perfNow = 0, lastT = 0, acc = 0;
function loop(t){
  requestAnimationFrame(loop);
  perfNow = t;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  if (G.viewLock > 0) G.viewLock -= dt;

  if (G.mode === 'play'){
    acc += dt;
    let guard = 0;
    while (acc >= DT && guard++ < 12){
      acc -= DT;
      G.players.forEach(p => stepBall(p, DT));
      if (G.busy){
        G.simTime += DT;
        if (G.simTime > SHOT_TIMEOUT) G.players.forEach(p => { p.ball.moving = false; p.ball.vx = p.ball.vy = 0; });
      }
    }
    if (G.busy && !G.players.some(p => p.ball.moving)) shotSettled();
    updateCamera(dt);

    // motion trails
    G.players.forEach(p => {
      const b = p.ball;
      b.trail = b.trail || [];
      if (b.moving){
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 9) b.trail.shift();
      } else if (b.trail.length){
        b.trail.shift();
      }
    });
  }

  // confetti physics run in screen space, independent of the course
  for (const p of confetti){
    p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += dt * 5;
    p.a -= dt * 0.55;
  }
  draw();
}
requestAnimationFrame(loop);

/* ============================================================
   SHOT FLOW
   ============================================================ */
const canShoot = () =>
  G.mode === 'play' && !G.busy && G.turn === G.me &&
  G.players[G.me] && !G.players[G.me].holed;

function takeShot(ang, pow, broadcast){
  const p = G.players[G.turn];
  if (!p || p.holed) return;
  p.strokes++;
  p.lastRest = { x: p.ball.x, y: p.ball.y };
  p.sunk = false;
  p.ball.vx = Math.cos(ang) * pow * MAX_SPEED;
  p.ball.vy = Math.sin(ang) * pow * MAX_SPEED;
  p.ball.moving = true;
  p.ball.portalCd = 0.25;
  G.busy = true; G.simTime = 0;
  sfxHit(pow);
  updateHUD();
  if (broadcast && G.online) net.send({ t: 'shot', hole: G.hole, idx: G.turn, ang, pow });
}

function shotSettled(){
  const p = G.players[G.turn];
  if (!p){ G.busy = false; return; }

  if (p.sunk){
    p.holed = true;
    p.scores[G.hole] = p.strokes;
    const rel = p.strokes - G.course.par;
    flash(p.strokes === 1 ? 'Hole in One!' : (SCORE_NAMES[rel] || `+${rel}`),
          `${p.name} · ${p.strokes} stroke${p.strokes > 1 ? 's' : ''}`,
          rel < 0 ? 'good' : rel > 0 ? 'bad' : '');
    sfxDrop();
    if (rel < 0) burstConfetti(p.strokes === 1 ? 90 : 46);
  } else if (p.strokes >= STROKE_LIMIT){
    p.holed = true;
    p.scores[G.hole] = STROKE_LIMIT;
    flash('Max strokes', `${p.name} picks up`);
  }

  const shooter = G.turn;
  G.busy = false;

  // The shooter decides whose turn is next, not just where the ball stopped.
  // Leaving the other client to work that out from its own simulation meant a
  // paused tab (backgrounded phone, throttled rAF) never advanced the turn.
  const done = G.players.every(x => x.holed);
  if (!done) advanceTurn();

  if (G.online && shooter === G.me){
    net.send({ t: 'rest', hole: G.hole, idx: shooter,
               x: p.ball.x, y: p.ball.y, strokes: p.strokes, holed: p.holed,
               score: p.scores[G.hole], turn: G.turn, next: done });
  }

  if (done) setTimeout(nextHole, 1400);
  updateHUD();
}

// Rotate to the next player still on the hole. Advancing the hole itself is
// handled by the caller, so this stays a pure rotation.
function advanceTurn(){
  for (let i = 1; i <= G.players.length; i++){
    const n = (G.turn + i) % G.players.length;
    if (!G.players[n].holed){ G.turn = n; break; }
  }
}

function nextHole(){
  G.hole++;
  if (G.hole >= HOLES){ endGame(); return; }
  loadHole();
}

function loadHole(){
  G.course = genCourse(G.seed + G.hole * 7919, DIFF_CURVE[G.hole] ?? 0.5);
  parCache[G.hole] = G.course.par;
  buildStatic();
  G.players.forEach(p => {
    p.strokes = 0; p.holed = false; p.sunk = false;
    p.ball.x = G.course.tee.x + (p === G.players[1] ? 9 : -9);
    p.ball.y = G.course.tee.y;
    p.ball.vx = p.ball.vy = 0; p.ball.moving = false; p.ball.portalCd = 0;
    p.lastRest = { x: p.ball.x, y: p.ball.y };
  });
  G.turn = 0;
  G.busy = false;
  G.viewLock = 1.6;                       // show the whole hole for a beat
  cam.x = WORLD_W / 2; cam.y = WORLD_H / 2; cam.zoom = fitZoom();
  updateHUD();
  holeIntro();
}

function endGame(){
  G.mode = 'over';
  showCard(true);
}

/* ============================================================
   INPUT
   ============================================================ */
let dragging = false, dragStart = null;

cv.addEventListener('pointerdown', e => {
  if (!canShoot()) return;
  dragging = true; G.aiming = true;
  dragStart = { x: e.clientX, y: e.clientY };
  G.aim = { x: 0, y: 0 };
  cv.setPointerCapture(e.pointerId);
  powerEl.classList.add('on');
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  // drag away from the target to pull back, like a real putter
  const dx = dragStart.x - e.clientX, dy = dragStart.y - e.clientY;
  G.aim = { x: dx, y: dy };
  const pow = Math.min(1, Math.hypot(dx, dy) / MAX_DRAG);
  powerFill.style.height = (pow * 100) + '%';
});
function endDrag(){
  if (!dragging) return;
  dragging = false; G.aiming = false;
  powerEl.classList.remove('on');
  powerFill.style.height = '0%';
  const len = Math.hypot(G.aim.x, G.aim.y);
  if (len < 12 || !canShoot()) return;
  const pow = Math.min(1, len / MAX_DRAG);
  const ang = Math.atan2(G.aim.y, G.aim.x);
  takeShot(ang, pow, true);
}
// Abort an aim without playing the shot.
function cancelDrag(){
  if (!dragging) return;
  dragging = false; G.aiming = false; G.aim = { x: 0, y: 0 };
  powerEl.classList.remove('on');
  powerFill.style.height = '0%';
}

cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
// A pointerup can be lost entirely — released outside the window, the tab
// backgrounded mid-drag, a touch stolen by the browser. Without these the aim
// line and power meter stick on screen and the next tap is ignored.
window.addEventListener('pointerup', endDrag);
window.addEventListener('blur', cancelDrag);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelDrag(); });

/* ============================================================
   HUD
   ============================================================ */
const hud = document.getElementById('hud');
const powerEl = document.getElementById('power');
const powerFill = document.getElementById('powerfill');
const toastEl = document.getElementById('toast');
const turnbar = document.getElementById('turnbar');

function updateHUD(){
  if (G.mode !== 'play' && G.mode !== 'over') return;
  for (let i = 0; i < 2; i++){
    const p = G.players[i];
    const st = document.getElementById('st' + i);
    const nm = document.getElementById('nm' + i);
    if (!p || !st) continue;
    st.querySelector('span').textContent = p.holed ? (p.scores[G.hole] ?? p.strokes) : p.strokes;
    st.classList.toggle('active', i === G.turn && !G.busy);
    nm.textContent = (G.online && i === G.me) ? 'You' : p.name;
  }
  document.getElementById('hiHole').textContent = `HOLE ${G.hole + 1}`;
  const tierEl = document.getElementById('hiTier');
  tierEl.textContent = G.course ? G.course.tier : '';
  tierEl.className = 'tier ' + (G.course ? G.course.tier : '');
  document.getElementById('hiPar').textContent = `PAR ${G.course ? G.course.par : '-'}`;
  document.getElementById('hiTot').textContent = relTotalText();
  const pips = document.getElementById('hiPips');
  if (pips.children.length !== HOLES){
    pips.innerHTML = Array.from({ length: HOLES }, () => '<span></span>').join('');
  }
  for (let i = 0; i < HOLES; i++){
    pips.children[i].className = i < G.hole ? 'done' : i === G.hole ? 'now' : '';
  }
  const mine = G.turn === G.me;
  turnbar.textContent = G.busy ? '' : (mine ? 'Your turn — drag to aim' : `${G.players[G.turn].name}'s turn`);
  turnbar.style.opacity = G.busy ? 0 : 1;
}

function relTotal(i){
  const p = G.players[i]; if (!p) return 0;
  let rel = 0;
  for (let h = 0; h < HOLES; h++){
    if (p.scores[h] === null) continue;
    rel += p.scores[h] - parOf(h);
  }
  return rel;
}
const parCache = {};
function parOf(h){ return parCache[h] ?? 3; }
function relTotalText(){
  const r = relTotal(G.me);
  return r === 0 ? 'EVEN' : (r > 0 ? `+${r}` : `${r}`);
}

let toastTimer = null;
function flash(msg, sub, kind){
  toastEl.innerHTML = msg + (sub ? `<small>${sub}</small>` : '');
  toastEl.className = 'on ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = kind || ''; }, 1600);
}

let introTimer = null;
function holeIntro(){
  const el = document.getElementById('intro');
  document.getElementById('introHole').textContent = `HOLE ${G.hole + 1}`;
  document.getElementById('introSub').textContent = `PAR ${G.course.par} · ${G.course.tier}`;
  el.classList.add('on');
  clearTimeout(introTimer);
  introTimer = setTimeout(() => el.classList.remove('on'), 1500);
}

document.getElementById('btnZoom').onclick = () => { G.overview = !G.overview; };
document.getElementById('btnCard').onclick = () => showCard(false);
document.getElementById('bCardClose').onclick = () => {
  if (G.mode === 'over'){ location.reload(); return; }
  document.getElementById('card').classList.add('hide');
};

function showCard(final){
  // remember this hole's par so the scorecard stays accurate on later holes
  if (G.course) parCache[G.hole] = G.course.par;
  const head = document.getElementById('cardHead');
  const body = document.getElementById('cardBody');
  document.getElementById('cardTitle').textContent = final ? winnerText() : 'Scorecard';

  const tierMark = i => {
    const d = DIFF_CURVE[i] ?? 0.5;
    const t = tierOf(d);
    return `<th><span class="th-n">${i + 1}</span><span class="th-d ${t}"></span></th>`;
  };
  head.innerHTML = '<th></th>' + Array.from({ length: HOLES }, (_, i) => tierMark(i)).join('') + '<th>TOT</th>';

  let html = '<tr class="par-row"><td>Par</td>' +
    Array.from({ length: HOLES }, (_, i) => `<td>${parCache[i] ?? '–'}</td>`).join('') +
    // sum only the holes shown in the row above, never whatever else is cached
    `<td class="tot">${Array.from({ length: HOLES }, (_, i) => parCache[i] ?? 0)
        .reduce((a, b) => a + b, 0) || '–'}</td></tr>`;

  G.players.forEach((p, i) => {
    html += `<tr><td>${(G.online && i === G.me) ? 'You' : p.name}</td>`;
    let tot = 0;
    for (let hIdx = 0; hIdx < HOLES; hIdx++){
      const s = p.scores[hIdx];
      if (s === null){ html += '<td>–</td>'; continue; }
      tot += s;
      const rel = s - (parCache[hIdx] ?? s);
      const cls = rel < 0 ? 'u' : rel > 0 ? 'o' : '';
      html += `<td class="${cls}">${s}</td>`;
    }
    html += `<td class="tot">${tot || '–'}</td></tr>`;
  });
  body.innerHTML = html;
  document.getElementById('card').classList.remove('hide');
}
function winnerText(){
  const tot = G.players.map(p => p.scores.reduce((a, b) => a + (b ?? 0), 0));
  if (G.players.length < 2){
    const r = relTotal(0);
    return `Final: ${tot[0]} (${r === 0 ? 'even' : r > 0 ? '+' + r : r})`;
  }
  if (tot[0] === tot[1]) return 'Tied game!';
  const w = tot[0] < tot[1] ? 0 : 1;
  return (G.online && w === G.me) ? 'You win! 🏆' : `${G.players[w].name} wins! 🏆`;
}

/* ============================================================
   SOUND (tiny WebAudio blips, no assets)
   ============================================================ */
let AC = null;
const ac = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function blip(freq, dur, type, vol){
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol ?? 0.09, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}
const sfxHit  = pow => blip(180 + pow * 220, 0.08, 'square', 0.06);
const sfxPing = ()  => blip(880, 0.12, 'triangle', 0.05);
const sfxDrop = ()  => { blip(520, 0.1, 'sine', 0.09); setTimeout(() => blip(780, 0.16, 'sine', 0.09), 90); };

/* ============================================================
   NETWORKING (PeerJS, host-relayed, turn-based)
   Both sides generate identical courses from the shared seed and
   simulate every shot locally; the shooter then sends the exact
   resting position so the two views can never drift apart.
   ============================================================ */
const net = {
  peer: null, conn: null, connected: false,

  initHost(code){
    return new Promise((resolve, reject) => {
      const peer = new Peer('mgolf-' + code, { debug: 1 });
      net.peer = peer;
      peer.on('open', id => resolve(id));
      peer.on('error', err => reject(err));
      peer.on('connection', conn => {
        if (net.conn){ conn.close(); return; }          // room is full
        net.conn = conn;
        conn.on('open', () => {
          net.connected = true;
          conn.on('data', m => net.recv(m));
          conn.on('close', net.dropped);
          startAsHost();
        });
      });
    });
  },

  initClient(code){
    return new Promise((resolve, reject) => {
      const peer = new Peer({ debug: 0 });
      net.peer = peer;
      const timer = setTimeout(() => reject(new Error('timeout')), 12000);
      peer.on('error', err => { clearTimeout(timer); reject(err); });
      peer.on('open', () => {
        const conn = peer.connect('mgolf-' + code, { reliable: true });
        net.conn = conn;
        conn.on('open', () => {
          clearTimeout(timer);
          net.connected = true;
          conn.on('data', m => net.recv(m));
          conn.on('close', net.dropped);
          resolve();
        });
        conn.on('error', err => { clearTimeout(timer); reject(err); });
      });
    });
  },

  send(msg){ if (net.conn && net.connected) try{ net.conn.send(msg); }catch(e){} },

  dropped(){
    net.connected = false;
    flash('Opponent left', 'Returning to menu');
    setTimeout(() => location.reload(), 2200);
  },

  recv(m){
    if (!m || !m.t) return;
    switch (m.t){
      case 'start':
        G.seed = m.seed;
        beginGame(1, m.hostName);
        break;
      case 'shot':
        if (m.hole !== G.hole) return;
        G.turn = m.idx;
        takeShot(m.ang, m.pow, false);
        break;
      case 'rest': {
        const p = G.players[m.idx];
        if (!p || m.hole !== G.hole) return;
        // The shooter's result is authoritative, so abandon our own replay of
        // the shot rather than letting it finish and re-decide the turn.
        G.players.forEach(q => { q.ball.moving = false; q.ball.vx = q.ball.vy = 0; });
        G.busy = false;
        p.ball.x = m.x; p.ball.y = m.y;
        p.strokes = m.strokes;
        p.holed = m.holed;
        p.scores[G.hole] = m.score ?? null;
        if (m.next) setTimeout(nextHole, 1400);
        else if (typeof m.turn === 'number') G.turn = m.turn;
        updateHUD();
        break;
      }
    }
  }
};

/* ============================================================
   FLOW / SCREENS
   ============================================================ */
const show = id => {
  ['scMenu', 'scHost', 'scJoin'].forEach(s =>
    document.getElementById(s).classList.toggle('hide', s !== id));
  if (id === null) ['scMenu', 'scHost', 'scJoin'].forEach(s =>
    document.getElementById(s).classList.add('hide'));
};
const randCode = () => {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no I/O/0/1
  let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
};

function beginGame(myIndex, otherName){
  G.mode = 'play';
  G.me = myIndex;
  G.players = myIndex === 0
    ? [newPlayer('You'), newPlayer(otherName || 'Rival')]
    : [newPlayer(otherName || 'Host'), newPlayer('You')];
  G.hole = 0;
  show(null);
  hud.style.display = 'block';
  document.getElementById('av0').textContent = '🙂';
  document.getElementById('av1').textContent = '😀';
  loadHole();
}
function startAsHost(){
  G.seed = (Math.random() * 1e9) | 0;
  net.send({ t: 'start', seed: G.seed, hostName: 'Host' });
  beginGame(0, 'Rival');
}

// --- menu buttons ---
document.getElementById('bHost').onclick = async () => {
  G.online = true;
  const code = randCode();
  document.getElementById('hostCode').textContent = code;
  document.getElementById('hostMsg').textContent = 'Share this code. Waiting for your opponent…';
  show('scHost');
  try{
    await net.initHost(code);
  }catch(err){
    document.getElementById('hostMsg').textContent = 'Could not open a room. Check your connection and try again.';
    document.getElementById('hostSpin').style.display = 'none';
  }
};
document.getElementById('bHostBack').onclick = () => location.reload();
document.getElementById('bJoinScreen').onclick = () => { show('scJoin'); document.getElementById('joinCode').focus(); };
document.getElementById('bJoinBack').onclick = () => show('scMenu');

document.getElementById('bJoin').onclick = async () => {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const err = document.getElementById('joinErr');
  if (code.length !== 4){ err.textContent = 'Enter the 4-character code.'; return; }
  G.online = true;
  err.textContent = 'Connecting…';
  document.getElementById('bJoin').disabled = true;
  try{
    await net.initClient(code);
    err.textContent = 'Connected! Starting…';
  }catch(e){
    err.textContent = 'No game found with that code.';
    document.getElementById('bJoin').disabled = false;
    try{ net.peer && net.peer.destroy(); }catch(_){}
  }
};
document.getElementById('joinCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('bJoin').click();
});

document.getElementById('bSolo').onclick = () => {
  G.online = false;
  G.seed = (Math.random() * 1e9) | 0;
  G.mode = 'play';
  G.me = 0;
  G.players = [newPlayer('You')];
  G.hole = 0;
  show(null);
  hud.style.display = 'block';
  document.querySelector('.chip.right').style.display = 'none';
  document.getElementById('nm1').style.display = 'none';
  loadHole();
};
